{% extends 'base.html' %}
{% block title %}情報サイト | KABUPICK X{% endblock %}
{% block content %}
<section class="hero compact"><div><p class="eyebrow">SOURCE LINKS</p><h1>{% if code %}{{ code }}.T の情報サイト{% else %}株価・企業情報サイト{% endif %}</h1><p class="subtext">公式開示、株価、財務、ニュースを確認できるサイトをまとめています。</p></div></section>
<section class="link-grid">{% for name, url in content.sites %}<a class="panel source-link" href="{{ url }}" target="_blank" rel="noopener noreferrer">{{ name }} <span aria-hidden="true">↗</span></a>{% endfor %}</section>
{% endblock %}
