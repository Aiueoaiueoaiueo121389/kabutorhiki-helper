services:
  - type: web
    name: kabupick-signal-engine
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements-http.txt
    startCommand: uvicorn http_app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: KABUPICK_HOSTED
        value: "1"
