services:
  - type: web
    name: kabupick-signal-engine
    runtime: python
    plan: free
    region: singapore
    buildCommand: npm --prefix stock_search ci && npm --prefix stock_search run build
    startCommand: python stock_search/serve_static.py
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: KABUPICK_HOSTED
        value: "1"
